name: Build & Deploy

on:
  push:
    branches: [prod, preview, dev, test]

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: harbor.corex-infra.de/corex/cx-o-nexredirect

jobs:
  build-push:
    runs-on: cx-build
    outputs:
      sha: ${{ steps.meta.outputs.sha }}
    steps:
      - uses: actions/checkout@v4

      - name: Image tags
        id: meta
        run: |
          echo "branch=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          echo "sha=sha-${GITHUB_SHA::8}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: An Harbor anmelden
        uses: docker/login-action@v3
        with:
          registry: harbor.corex-infra.de
          username: ${{ secrets.HARBOR_USERNAME }}
          password: ${{ secrets.HARBOR_PASSWORD }}

      - name: Build & push image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ steps.meta.outputs.branch }}
            ${{ env.IMAGE }}:${{ steps.meta.outputs.sha }}
            ${{ github.ref_name == 'prod' && format('{0}:latest', env.IMAGE) || '' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
          labels: |
            org.opencontainers.image.source=https://github.com/cx-mgmt/cx-o-nexredirect
            org.opencontainers.image.revision=${{ github.sha }}


      - name: Image signieren
        env:
          COSIGN_KEY: ${{ secrets.COSIGN_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
          COSIGN_VERSION: v2.6.5
        # --recursive signiert den Index *und* jedes Plattform-Manifest darunter.
        # Harbor prueft beim Pull das plattformspezifische Manifest; nur den Index
        # zu signieren blockiert den Pull, obwohl das Image signiert aussieht.
        # --tlog-upload=false haelt die Digests aus dem oeffentlichen
        # Transparenzprotokoll heraus - die Images sind privat.
        run: |
          # Direkter Download statt sigstore/cosign-installer: die Action ruft
          # envsubst auf, das im ARC-Runner-Image nicht enthalten ist.
          curl -sSLf -o /tmp/cosign "https://github.com/sigstore/cosign/releases/download/${COSIGN_VERSION}/cosign-linux-amd64"
          chmod +x /tmp/cosign
          /tmp/cosign sign --key env://COSIGN_KEY \
            --tlog-upload=false --recursive --yes \
            ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}

      - name: Trivy image scan (report only)
        env:
          TRIVY_USERNAME: ${{ secrets.HARBOR_USERNAME }}
          TRIVY_PASSWORD: ${{ secrets.HARBOR_PASSWORD }}
        uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: ${{ env.IMAGE }}:${{ steps.meta.outputs.sha }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "0"
          format: table

  deploy:
    needs: build-push
    runs-on: cx-build
    # Jeder Branch deployt in sein gleichnamiges Environment (prod/preview/dev/test).
    environment: ${{ github.ref_name }}
    steps:
      - name: Trigger Coolify deploy
        env:
          WEBHOOK: ${{ secrets.COOLIFY_WEBHOOK }}
          TOKEN: ${{ secrets.COOLIFY_TOKEN }}
        run: |
          if [ -z "$WEBHOOK" ]; then
            echo "No COOLIFY_WEBHOOK secret set for '${GITHUB_REF_NAME}' yet - skipping deploy trigger."
            exit 0
          fi
          curl -fsSL -X POST "$WEBHOOK" \
            ${TOKEN:+-H "Authorization: Bearer $TOKEN"} \
            && echo "Coolify deploy triggered for ${GITHUB_REF_NAME}."
