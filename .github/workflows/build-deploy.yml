name: Build & Deploy

# Nur push im eigenen Repo. Kein pull_request: Forks wuerden sonst die
# Workflow-Datei aus dem Merge-Commit mitbringen und cx-build / cx-klein
# treffen koennen. Der if an jedem Job bleibt auch dann stehen, falls
# jemand den Trigger spaeter erweitert.
on:
  push:
    branches: [prod, preview, dev, test]

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: harbor.corex-infra.de/corex/cx-o-nexredirect

jobs:
  build-push:
    if: github.event_name == 'push' && github.repository == 'cx-mgmt/cx-o-nexredirect'
    runs-on: cx-build
    outputs:
      sha: ${{ steps.meta.outputs.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Image tags
        id: meta
        run: |
          echo "branch=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          echo "sha=sha-${GITHUB_SHA::8}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: An Harbor anmelden
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: harbor.corex-infra.de
          username: ${{ secrets.HARBOR_USERNAME }}
          password: ${{ secrets.HARBOR_PASSWORD }}

      - name: Build & push image
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ steps.meta.outputs.branch }}
            ${{ env.IMAGE }}:${{ steps.meta.outputs.sha }}
            ${{ github.ref_name == 'prod' && format('{0}:latest', env.IMAGE) || '' }}
          # Cache in Harbor statt im GitHub-Cache: der Upload dorthin ging uebers
          # Internet und dauerte gut vier Minuten, laenger als der Bau selbst.
          cache-from: |
            type=registry,ref=${{ env.IMAGE }}:buildcache-${{ github.ref_name }}
            type=registry,ref=${{ env.IMAGE }}:buildcache-prod
          cache-to: type=registry,ref=${{ env.IMAGE }}:buildcache-${{ github.ref_name }},mode=max,image-manifest=true,oci-mediatypes=true,ignore-error=true
          provenance: false
          labels: |
            org.opencontainers.image.source=https://github.com/cx-mgmt/cx-o-nexredirect
            org.opencontainers.image.revision=${{ github.sha }}


      - name: Image signieren
        env:
          COSIGN_KEY: ${{ secrets.COSIGN_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
          COSIGN_VERSION: v2.6.5
        # --recursive signiert den Index *und* jedes Plattform-Manifest darunter.
        # Harbor prueft beim Pull das plattformspezifische Manifest; nur den Index
        # zu signieren blockiert den Pull, obwohl das Image signiert aussieht.
        # --tlog-upload=false haelt die Digests aus dem oeffentlichen
        # Transparenzprotokoll heraus - die Images sind privat.
        run: |
          # Direkter Download statt sigstore/cosign-installer: die Action ruft
          # envsubst auf, das im ARC-Runner-Image nicht enthalten ist.
          curl -sSLf -o /tmp/cosign "https://github.com/sigstore/cosign/releases/download/${COSIGN_VERSION}/cosign-linux-amd64"
          chmod +x /tmp/cosign
          /tmp/cosign sign --key env://COSIGN_KEY \
            --tlog-upload=false --recursive --yes \
            ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}

  # Der Scan meldet nur und haelt nichts auf, deshalb laeuft er neben dem
  # Ausrollen auf einem kleinen Runner statt den Build-Knoten zu belegen.
  image-scan:
    needs: build-push
    if: success() && github.event_name == 'push' && github.repository == 'cx-mgmt/cx-o-nexredirect'
    runs-on: cx-klein
    steps:
      - name: Trivy image scan (report only)
        continue-on-error: true
        env:
          TRIVY_USERNAME: ${{ secrets.HARBOR_USERNAME }}
          TRIVY_PASSWORD: ${{ secrets.HARBOR_PASSWORD }}
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # 0.35.0
        with:
          image-ref: ${{ env.IMAGE }}:${{ needs.build-push.outputs.sha }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "0"
          format: table

  deploy:
    needs: build-push
    if: success() && github.event_name == 'push' && github.repository == 'cx-mgmt/cx-o-nexredirect'
    runs-on: cx-klein
    # Jeder Branch deployt in sein gleichnamiges Environment (prod/preview/dev/test).
    environment: ${{ github.ref_name }}
    steps:
      - name: Trigger Coolify deploy
        env:
          WEBHOOK: ${{ secrets.COOLIFY_WEBHOOK }}
          TOKEN: ${{ secrets.COOLIFY_TOKEN }}
        run: |
          if [ -z "$WEBHOOK" ]; then
            echo "No COOLIFY_WEBHOOK secret set for '${GITHUB_REF_NAME}' yet - skipping deploy trigger."
            exit 0
          fi
          curl -fsSL -X POST "$WEBHOOK" \
            ${TOKEN:+-H "Authorization: Bearer $TOKEN"} \
            && echo "Coolify deploy triggered for ${GITHUB_REF_NAME}."
