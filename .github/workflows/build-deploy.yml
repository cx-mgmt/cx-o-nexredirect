name: Build & Deploy

on:
  push:
    branches: [prod, preview, dev, test]

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/cx-mgmt/cx-nexredirect

jobs:
  build-push:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.meta.outputs.sha }}
    steps:
      - uses: actions/checkout@v4

      - name: Image tags
        id: meta
        run: |
          echo "branch=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          echo "sha=sha-${GITHUB_SHA::8}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ steps.meta.outputs.branch }}
            ${{ env.IMAGE }}:${{ steps.meta.outputs.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
          labels: |
            org.opencontainers.image.source=https://github.com/cx-mgmt/cx-nexredirect
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Trivy image scan (report only)
        uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: ${{ env.IMAGE }}:${{ steps.meta.outputs.sha }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "0"
          format: table

  deploy:
    needs: build-push
    if: github.ref_name == 'prod' || github.ref_name == 'preview'
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'prod' && 'production' || 'preview' }}
    steps:
      - name: Trigger Coolify deploy
        env:
          WEBHOOK: ${{ secrets.COOLIFY_WEBHOOK }}
          TOKEN: ${{ secrets.COOLIFY_TOKEN }}
        run: |
          if [ -z "$WEBHOOK" ]; then
            echo "No COOLIFY_WEBHOOK secret set for '${GITHUB_REF_NAME}' yet - skipping deploy trigger."
            exit 0
          fi
          curl -fsSL -X POST "$WEBHOOK" \
            ${TOKEN:+-H "Authorization: Bearer $TOKEN"} \
            && echo "Coolify deploy triggered for ${GITHUB_REF_NAME}."
