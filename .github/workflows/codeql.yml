# CodeQL Advanced, ohne Upload nach Code Scanning.
# cx-mgmt liegt auf GitHub Free und das Repo ist privat. Code Scanning
# gibt es dort nicht mehr. Die Analyse bleibt, die SARIF-Datei wird
# lokal ausgewertet und als Artefakt abgelegt.
name: "CodeQL Advanced"

on:
  push:
    branches: [ "prod" ]
  pull_request:
    branches: [ "prod" ]
  schedule:
    - cron: '34 10 * * 2'
  workflow_dispatch:

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    # Matrix ohne Swift, ARC-Scale-Set ist cx-build.
    # Das Runner-Image hat kein Python, das SARIF-Skript braucht setup-python.
    runs-on: cx-build
    permissions:
      # Checkout.
      contents: read
      # CodeQL-Bundle und Cache im privaten Repo, plus SARIF-Artefakt.
      # security-events entfällt: ohne Upload nach Code Scanning unnötig.
      # packages entfällt: es werden keine privaten CodeQL-Packs geladen.
      actions: write

    strategy:
      fail-fast: false
      matrix:
        include:
        - language: actions
          build-mode: none
        - language: javascript-typescript
          build-mode: none

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Initialize CodeQL
      uses: github/codeql-action/init@v4
      with:
        languages: ${{ matrix.language }}
        build-mode: ${{ matrix.build-mode }}

    - name: Run manual build steps
      if: matrix.build-mode == 'manual'
      shell: bash
      run: |
        echo 'If you are using a "manual" build mode for one or more of the' \
          'languages you are analyzing, replace this with the commands to build' \
          'your code, for example:'
        echo '  make bootstrap'
        echo '  make release'
        exit 1

    - name: SARIF-Verzeichnis anlegen
      run: mkdir -p "${{ github.workspace }}/codeql-results/${{ matrix.language }}"

    - name: Perform CodeQL Analysis
      id: codeql
      uses: github/codeql-action/analyze@v4
      with:
        category: "/language:${{matrix.language}}"
        # never, nicht false. false bedeutet failure-only und würde beim
        # Fehlschlag trotzdem nach Code Scanning hochladen.
        upload: never
        output: ${{ github.workspace }}/codeql-results/${{ matrix.language }}

    - name: Python fuer die SARIF-Auswertung
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: SARIF auswerten
      if: success()
      env:
        SARIF_DIR: ${{ steps.codeql.outputs.sarif-output || format('{0}/codeql-results/{1}', github.workspace, matrix.language) }}
        CODEQL_LANGUAGE: ${{ matrix.language }}
      run: python3 .github/scripts/codeql-sarif-summary.py

    - name: SARIF als Artefakt hochladen
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: codeql-sarif-${{ matrix.language }}
        path: ${{ steps.codeql.outputs.sarif-output || format('{0}/codeql-results/{1}', github.workspace, matrix.language) }}
        if-no-files-found: warn
