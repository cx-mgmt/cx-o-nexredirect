name: CI

on:
  pull_request:
  push:
    branches: [prod, preview, dev, test]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security:
    # ARC-Scale-Set cx-build. Trivy-Action laedt den Scanner selbst, das Runner-Image hat ihn nicht.
    runs-on: cx-build
    steps:
      - uses: actions/checkout@v4

      - name: Trivy filesystem scan (report only)
        uses: aquasecurity/trivy-action@0.35.0
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "0"
          format: table
