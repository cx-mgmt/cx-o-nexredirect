name: CI

# pull_request fuehrt die Workflow-Datei aus dem Merge-Commit aus. Ein Fork
# kann runs-on damit auf cx-build oder cx-klein drehen. Deshalb:
# dieser Job bleibt auf ubuntu-latest (GitHub-hosted), und Fork-PRs werden
# uebersprungen. Self-hosted Runner haengen nur an Build & Deploy, und nur
# an push im selben Repo.
# Vor dem Oeffentlichmachen zusaetzlich in den Actions-Einstellungen
# "Require approval for all outside collaborators" setzen. Eine geaenderte
# Workflow-Datei aus einem Fork laeuft sonst erst nach menschlicher Freigabe.
on:
  pull_request:
    branches: [prod, preview, dev, test]
  push:
    branches: [prod, preview, dev, test]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Trivy filesystem scan (report only)
        uses: aquasecurity/trivy-action@0.35.0
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "0"
          format: table
